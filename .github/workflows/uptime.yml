name: Uptime
on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  health:
    runs-on: ubuntu-latest
    steps:
      # The health route also queries the database, which stops a free database pausing from inactivity
      - run: curl --fail --silent --show-error --max-time 30 https://saakshya-eta.vercel.app/api/health
